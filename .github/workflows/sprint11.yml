name: Sprint 11 Docker Hub publication
on:
  push:
    branches: [sprint11-publish]
permissions:
  contents: read
env:
  SOURCE_SHA: e5db717906b14548acacf4653268905a09348b80
jobs:
  build:
    name: docker-${{ matrix.service }}-job
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Mezhnun89/taski
          ref: ${{ env.SOURCE_SHA }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in using existing Docker Hub credential
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and publish commit tag
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            mezhnun/taski-${{ matrix.service }}:sprint11-${{ env.SOURCE_SHA }}
            mezhnun/taski-${{ matrix.service }}:multi-stage
          cache-from: type=gha,scope=sprint11-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=sprint11-${{ matrix.service }}
  pull-and-run:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Mezhnun89/taski
          ref: ${{ env.SOURCE_SHA }}
      - name: Pull published images onto a fresh runner
        run: |
          docker pull "mezhnun/taski-frontend:sprint11-$SOURCE_SHA"
          docker pull "mezhnun/taski-backend:sprint11-$SOURCE_SHA"
      - name: Run the published images
        run: make run FRONTEND_IMAGE="mezhnun/taski-frontend:sprint11-$SOURCE_SHA" BACKEND_IMAGE="mezhnun/taski-backend:sprint11-$SOURCE_SHA"
      - name: Verify HTTP and CRUD
        run: python3 scripts/check_taski.py
      - name: Report image digests
        run: |
          docker image inspect "mezhnun/taski-frontend:sprint11-$SOURCE_SHA" --format '{{json .RepoDigests}}' | tee -a "$GITHUB_STEP_SUMMARY"
          docker image inspect "mezhnun/taski-backend:sprint11-$SOURCE_SHA" --format '{{json .RepoDigests}}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Clean up
        if: always()
        run: make clear
  jenkins-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare temporary Jenkins with Pipeline plugins
        run: docker build -t sprint11-jenkins .ci/jenkins
      - name: Execute actual Jenkinsfile on a temporary controller
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          export JENKINS_TEST_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$JENKINS_TEST_PASSWORD"
          docker run -d --name sprint11-jenkins --user root --network host -v /var/run/docker.sock:/var/run/docker.sock -e DOCKER_USER -e DOCKER_TOKEN -e JENKINS_TEST_PASSWORD -e JAVA_OPTS="-Djenkins.install.runSetupWizard=false" sprint11-jenkins --httpListenAddress=127.0.0.1
          python3 .ci/jenkins/poll.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jenkins-evidence
          path: |
            jenkins-console.log
            jenkins-result.json
      - name: Remove temporary Jenkins and lesson containers
        if: always()
        run: |
          docker rm -f sprint11-jenkins
          for name in taski-frontend taski-backend; do
            if docker container inspect "$name" >/dev/null 2>&1; then docker rm -f "$name"; fi
          done
